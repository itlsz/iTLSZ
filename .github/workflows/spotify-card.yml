name: Spotify card

# The README shows the live card from the Vercel function (api/spotify.py).
# This workflow records the track on the player (even paused) to last.json on the
# spotify-card branch, so the card can show what was really heard last.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify-card
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: secrets
        env:
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          if [ -z "$SPOTIFY_REFRESH_TOKEN" ]; then
            echo "::notice::Spotify secrets not configured yet; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record last track
        if: steps.secrets.outputs.ready == 'true'
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python3 spotify/card.py out --record

      # Single-commit orphan branch, force-pushed each run, so main's history stays clean.
      - name: Publish to spotify-card branch
        if: steps.secrets.outputs.ready == 'true' && hashFiles('out/last.json') != ''
        working-directory: out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b spotify-card
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "update spotify last track"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" spotify-card

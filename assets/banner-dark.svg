      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.896;1" dur="3.35s" fill="freeze"/>
      <text x="32" y="258" font-size="16"><tspan fill="#7ee787">luis@itlsz</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#8b949e">$</tspan></text>
      <rect x="166.4" y="244" width="9.6" height="18" fill="#7ee787">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>

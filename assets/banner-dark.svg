  <rect x="0.5" y="0.5" width="849" height="289" rx="12" fill="none" stroke="#30363d"/>

  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="425.0" y="23" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#8b949e">luis@itlsz: ~</text>

  <g font-family="'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">
    <text x="32" y="80" font-size="16"><tspan fill="#7ee787">luis@itlsz</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#79c0ff">~</tspan><tspan fill="#8b949e">$</tspan></text>
    <text x="166.4" y="80" font-size="16" fill="#e6edf3" clip-path="url(#type)">./todoesluis --init</text>

    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.844;1" dur="2.25s" fill="freeze"/>
      <text x="32" y="140" font-size="46" font-weight="700" fill="#e6edf3">Luis López</text>
      <text x="332" y="140" font-size="22" fill="#7ee787">&lt;todoesluis/&gt;</text>
    </g>
    <text x="32" y="178" font-size="19" font-weight="700" fill="#e6edf3"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.868;1" dur="2.65s" fill="freeze"/><tspan fill="#7ee787">&gt;</tspan> Analista de Sistemas <tspan fill="#8b949e">·</tspan> Desarrollador Full Stack</text>
    <text x="32" y="208" font-size="15" fill="#8b949e"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.881;1" dur="2.95s" fill="freeze"/><tspan fill="#7ee787">&gt;</tspan> análisis <tspan fill="#79c0ff">→</tspan> frontend <tspan fill="#79c0ff">→</tspan> backend <tspan fill="#79c0ff">→</tspan> datos <tspan fill="#79c0ff">→</tspan> cloud <tspan fill="#79c0ff">→</tspan> mobile</text>


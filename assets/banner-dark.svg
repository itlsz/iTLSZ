    </pattern>
    <clipPath id="win"><rect x="1" y="1" width="848" height="288" rx="12"/></clipPath>
    <clipPath id="type">
      <rect x="166.4" y="60" width="220.8" height="28">
        <animate attributeName="width" values="0.0;0.0;9.6;19.2;28.8;38.4;48.0;57.6;67.2;76.8;86.4;96.0;105.6;115.2;124.8;134.4;144.0;153.6;163.2;172.8;182.4;220.8" keyTimes="0.000;0.235;0.274;0.312;0.350;0.388;0.426;0.465;0.503;0.541;0.579;0.618;0.656;0.694;0.732;0.771;0.809;0.847;0.885;0.924;0.962;1" calcMode="discrete" dur="1.7s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect width="850" height="290" fill="#0d1117"/>
    <rect width="850" height="36" fill="#161b22"/>
    <rect y="36" width="850" height="1" fill="#30363d"/>
